name: AudioPencilLegacy

include:
  - path: Config/MacApp.yml
    relativePaths: false

options:
  xcodeVersion: "15.3"
  projectFormat: xcode15_3

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) AUDIOPENCIL_LEGACY_TOOLCHAIN

targets:
  AudioPencil:
    templates: [MacApp]

schemes:
  AudioPencil:
    build:
      targets:
        AudioPencil: all
    run:
      config: Debug
    archive:
      config: Release
