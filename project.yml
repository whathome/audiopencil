# XcodeGen definition. Regenerate the project with `xcodegen generate`
# (the generated AudioPencil.xcodeproj is not committed).
name: AudioPencil

options:
  bundleIdPrefix: com.weshopkins
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  AudioPencilKit:
    path: Packages/AudioPencilKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    DEAD_CODE_STRIPPING: YES

targets:
  AudioPencil:
    type: application
    platform: macOS
    sources:
      - App/Shared/Sources
      - App/macOS/Sources
      - App/macOS/Resources
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: Audio Pencil
        CFBundleName: Audio Pencil
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSMicrophoneUsageDescription: Audio Pencil listens while you dictate and transcribes on this Mac. Audio never leaves the device.
        NSAudioCaptureUsageDescription: Audio Pencil records audio from the call app you select so meeting notes include the other participants. Processing stays on this Mac.
        NSHumanReadableCopyright: ""
        # Plain-HTTP Nextcloud on the local network (LAN IPs, .local names); public servers still need HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/macOS/AudioPencil.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: Audio Pencil
        PRODUCT_MODULE_NAME: AudioPencil
        PRODUCT_BUNDLE_IDENTIFIER: com.weshopkins.audiopencil
        ENABLE_HARDENED_RUNTIME: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: AudioPencilKit
        product: APCore
      - package: AudioPencilKit
        product: APAudio
      - package: AudioPencilKit
        product: APModels
      - package: AudioPencilKit
        product: APTranscription
      - package: AudioPencilKit
        product: APPhonon
      - package: AudioPencilKit
        product: APSummary
      - package: AudioPencilKit
        product: APStorage
      - package: AudioPencilKit
        product: APSync

  AudioPencilPhone:
    type: application
    platform: iOS
    sources:
      - App/Shared/Sources
      - App/iOS/Sources
      - App/iOS/Intents
      - App/iOS/Resources
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Audio Pencil
        CFBundleName: Audio Pencil
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Audio Pencil listens while you record and transcribes on this device. Audio never leaves the device unless you file it in your own notes folder.
        # Keeps recording with the phone locked; the Live Activity shows the clock and controls.
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        # Plain-HTTP Nextcloud on the local network (LAN IPs, .local names); public servers still need HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: Audio Pencil
        PRODUCT_MODULE_NAME: AudioPencilPhone
        PRODUCT_BUNDLE_IDENTIFIER: com.weshopkins.audiopencil
        TARGETED_DEVICE_FAMILY: "1,2"
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: AudioPencilWidgets
        embed: true
      - package: AudioPencilKit
        product: APCore
      - package: AudioPencilKit
        product: APAudio
      - package: AudioPencilKit
        product: APModels
      - package: AudioPencilKit
        product: APTranscription
      - package: AudioPencilKit
        product: APSummary
      - package: AudioPencilKit
        product: APStorage
      - package: AudioPencilKit
        product: APSync

  AudioPencilWidgets:
    type: app-extension
    platform: iOS
    sources:
      - App/iOSWidgets/Sources
      - App/iOS/Intents
      - App/iOSWidgets/Resources
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: App/iOSWidgets/Info.plist
      properties:
        CFBundleDisplayName: Audio Pencil
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: AudioPencilWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.weshopkins.audiopencil.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        APPLICATION_EXTENSION_API_ONLY: YES

  AudioPencilDesktopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/DesktopTests
      - App/macOS/Sources/DictationIssue.swift
      - App/macOS/Sources/HotkeyEventProcessor.swift
      - App/macOS/Sources/HotkeyMonitor.swift
      - App/macOS/Sources/SidebarWindowLayout.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weshopkins.audiopencil.desktoptests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: AudioPencilKit
        product: APCore

  AudioPencilMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/MobileUITests
    dependencies:
      - target: AudioPencilPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weshopkins.audiopencil.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  AudioPencil:
    build:
      targets:
        AudioPencil: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AudioPencilDesktopTests
        - package: AudioPencilKit/APCoreTests
        - package: AudioPencilKit/APAudioTests
        - package: AudioPencilKit/APTranscriptionTests
        - package: AudioPencilKit/APSummaryTests
        - package: AudioPencilKit/APStorageTests
        - package: AudioPencilKit/APSyncTests
    profile:
      config: Release
    archive:
      config: Release
  AudioPencilPhone:
    build:
      targets:
        AudioPencilPhone: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AudioPencilMobileUITests
    archive:
      config: Release
