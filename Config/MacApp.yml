options:
  bundleIdPrefix: com.weshopkins
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  AudioPencilKit:
    path: Packages/AudioPencilKit

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEAD_CODE_STRIPPING: YES

targetTemplates:
  MacApp:
    type: application
    platform: macOS
    sources:
      - App/Shared/Sources
      - App/macOS/Sources
      - App/macOS/Resources
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: Audio Pencil
        CFBundleName: Audio Pencil
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSMicrophoneUsageDescription: Audio Pencil listens while you dictate and transcribes on this Mac. Audio never leaves the device.
        NSAudioCaptureUsageDescription: Audio Pencil records audio from the call app you select so meeting notes include the other participants. Processing stays on this Mac.
        NSHumanReadableCopyright: ""
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/macOS/AudioPencil.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: Audio Pencil
        PRODUCT_MODULE_NAME: AudioPencil
        PRODUCT_BUNDLE_IDENTIFIER: com.weshopkins.audiopencil
        ENABLE_HARDENED_RUNTIME: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: AudioPencilKit
        product: APCore
      - package: AudioPencilKit
        product: APAudio
      - package: AudioPencilKit
        product: APModels
      - package: AudioPencilKit
        product: APTranscription
      - package: AudioPencilKit
        product: APSummary
      - package: AudioPencilKit
        product: APStorage
      - package: AudioPencilKit
        product: APSync
